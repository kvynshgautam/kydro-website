<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KYDRO - Redirecting...</title>
  <script>
    // GitHub Pages 404 SPA Router
    const path = window.location.pathname;
    if (path.endsWith('/web') || path.includes('/web/')) {
      window.location.replace(path.replace(/\/web(\/)?$/, '/web.html'));
    } else {
      window.location.replace('./');
    }
  </script>
</head>
<body style="background:#030712; color:#fff; font-family:sans-serif; text-align:center; padding-top:100px;">
  <h2>Redirecting to KYDRO...</h2>
</body>
</html>
